# Copier vers %LOCALAPPDATA%\ClubDirectorAI\config.toml (ou définir CLUBDIRECTOR_CONFIG).
# AUCUNE clé API ici : utiliser CLUBDIRECTOR_SECRET_<REF> ou le trousseau Windows.

# save_dirs = ["C:/Users/<vous>/Documents/Sports Interactive/Football Manager 26/games"]
port = 8765
snapshot_retention = 10

[ai]
mode = "local"            # local | hybride (niveaux 1-2) | premium (niveaux 1-3)
monthly_budget_usd = 5.0
max_tool_rounds = 6

[[ai.providers]]
name = "llama.cpp local"
kind = "openai_compat"
base_url = "http://127.0.0.1:8080/v1"   # llama-server --jinja ; Ollama : http://127.0.0.1:11434/v1
model = "local-model"
tier = 1

