<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Téléphone du coach</title>
<style>
:root {
  --font: -apple-system, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --font-display: -apple-system, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --frame: #0b0b0d;
  --bg: #000000; --bg-elev: #1c1c1e; --bg-elev2: #2c2c2e; --bg-grouped: #000000;
  --sep: rgba(84, 84, 88, .55); --fill: rgba(118, 118, 128, .24);
  --text: #ffffff; --text2: rgba(235, 235, 245, .6); --text3: rgba(235, 235, 245, .3);
  --blue: #0a84ff; --sent: #0a84ff; --sent-text: #ffffff; --received: #26262a; --received-text: #ffffff;
  --red: #ff453a; --green: #30d158; --orange: #ff9f0a; --gray: #8e8e93;
  --bar: rgba(22, 22, 24, .8); --ours: rgba(10, 132, 255, .18);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #ffffff; --bg-elev: #f2f2f7; --bg-elev2: #ffffff; --bg-grouped: #f2f2f7;
  --sep: rgba(60, 60, 67, .29); --fill: rgba(118, 118, 128, .12);
  --text: #000000; --text2: rgba(60, 60, 67, .6); --text3: rgba(60, 60, 67, .3);
  --blue: #007aff; --sent: #007aff; --received: #e9e9eb; --received-text: #000000;
  --red: #ff3b30; --green: #34c759; --orange: #ff9500;
  --bar: rgba(249, 249, 249, .85); --ours: rgba(0, 122, 255, .12);
  color-scheme: light;
}
:root[data-theme="light"] .grouped { --bg-elev: #ffffff; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--frame); overflow: hidden; }
body { font: 17px/1.3 var(--font); color: var(--text); user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.selectable { user-select: text; }

/* ------------------------------------------------------------------ appareil */
.device { position: fixed; inset: 0; padding: 9px; border-radius: 56px; background: var(--frame);
  box-shadow: inset 0 0 0 1.5px #3a3a3e, inset 0 0 0 3px #111; }
.screen { position: relative; width: 100%; height: 100%; border-radius: 47px; overflow: hidden; overflow: clip; background: #000; isolation: isolate; }
.island { position: absolute; top: 11px; left: 50%; width: 118px; height: 34px; margin-left: -59px; border-radius: 20px;
  background: #000; z-index: 60; pointer-events: none; }
.statusbar { position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 50; display: flex; align-items: center;
  justify-content: space-between; padding: 6px 30px 0 40px; font: 600 16px/1 var(--font-display); color: var(--text);
  cursor: grab; transition: color .3s; }
.statusbar.light { color: #fff; }
.statusbar .icons { display: flex; gap: 6px; align-items: center; }
.statusbar svg { fill: currentColor; display: block; }
.home-indicator { position: absolute; bottom: 8px; left: 50%; width: 136px; height: 5px; margin-left: -68px; border-radius: 3px;
  background: var(--text); opacity: .9; z-index: 55; cursor: pointer; transition: background .3s; }
.home-indicator.light { background: #fff; }
.home-indicator::before { content: ""; position: absolute; inset: -12px -20px; }

/* ------------------------------------------------------------------ vues */
.view { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column;
  transition: transform .4s cubic-bezier(.32, .72, 0, 1), opacity .3s, border-radius .4s; will-change: transform; }
.view.grouped { background: var(--bg-grouped); }
.view.hidden-right { transform: translateX(100%); }
.view.hidden-left { transform: translateX(-28%); }
.view.app-closed { transform: scale(.82); opacity: 0; border-radius: 40px; pointer-events: none; }
.view[hidden] { display: none; }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; overscroll-behavior: contain; }
.scroll::-webkit-scrollbar { display: none; }
.pressable { transition: transform .12s, filter .12s, background .15s; }
.pressable:active { transform: scale(.97); }

/* ------------------------------------------------------------------ écran d'accueil */
#home { background:
    radial-gradient(120% 70% at 85% 8%, #b3261e 0%, rgba(179, 38, 30, 0) 55%),
    radial-gradient(110% 70% at 10% 95%, #f2a900 0%, rgba(242, 169, 0, 0) 55%),
    radial-gradient(80% 60% at 20% 30%, #5b0f1a 0%, rgba(91, 15, 26, 0) 70%),
    linear-gradient(160deg, #3a0a12 0%, #1a0508 55%, #2a1205 100%);
  padding: 62px 20px 0; color: #fff; transition: transform .4s cubic-bezier(.32, .72, 0, 1), filter .35s; }
#home.behind { transform: scale(1.06); filter: blur(8px) brightness(.65); }
.widgets { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.w { border-radius: 22px; padding: 13px 14px; background: rgba(255, 255, 255, .15); color: #fff; text-align: left;
  backdrop-filter: blur(26px) saturate(170%); box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .22); min-height: 156px;
  display: flex; flex-direction: column; overflow: hidden; }
.w.wide { grid-column: 1 / -1; min-height: 0; }
.w .wh { font: 700 12px var(--font); letter-spacing: .3px; text-transform: uppercase; opacity: .8; }
.w.cal .wday { font: 700 13px var(--font); color: #ff6b5e; text-transform: uppercase; letter-spacing: .3px; }
.w.cal .wnum { font: 300 54px/1 var(--font-display); margin: 2px 0 4px; }
.w.cal .wsub { font-size: 12.5px; opacity: .85; margin-top: auto; line-height: 1.3; }
.w.cal .wsub b { font-weight: 700; display: block; }
.w.rank .wbig { font: 700 52px/1 var(--font-display); margin: 8px 0 2px; }
.w.rank .wbig sup { font-size: 22px; vertical-align: super; margin-left: 1px; }
.w.rank .wsub { font-size: 12.5px; opacity: .85; margin-top: auto; }
.w.match { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 12px 14px; }
.w.match .side { font: 600 14px var(--font); text-align: center; }
.w.match .score { font: 700 26px var(--font-display); text-align: center; }
.w.match .meta { grid-column: 1 / -1; font-size: 12px; opacity: .75; text-align: center; }
.apps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px 0; margin-top: 22px; justify-items: center; }
.app { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 76px; }
.app .label { font: 500 12px var(--font); color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, .45); white-space: nowrap; }
.icon { position: relative; width: 62px; height: 62px; border-radius: 15px; display: grid; place-items: center;
  box-shadow: 0 3px 10px rgba(0, 0, 0, .28); transition: transform .15s, filter .15s; }
.app:active .icon { transform: scale(.88); filter: brightness(.75); }
.icon svg { width: 38px; height: 38px; }
.ic-messages { background: linear-gradient(180deg, #67f27f 0%, #0bbd2b 100%); }
.ic-contacts { background: linear-gradient(180deg, #ececee 0%, #c4c5ca 100%); }
.ic-calendar { background: #fff; color: #000; display: flex; flex-direction: column; justify-content: center; gap: 0; }
.ic-calendar .d { font: 600 11px var(--font); color: #ff3b30; text-transform: capitalize; margin-top: 2px; }
.ic-calendar .n { font: 300 32px/1 var(--font-display); margin-top: -1px; }
.ic-table { background: linear-gradient(180deg, #4b6cff 0%, #1d2fbf 100%); }
.ic-squad { background: linear-gradient(180deg, #33c46b 0%, #137a3d 100%); }
.ic-settings { background: linear-gradient(180deg, #9a9aa0 0%, #5e5e66 100%); }
.badge { position: absolute; top: -6px; right: -8px; min-width: 23px; height: 23px; padding: 0 6px; border-radius: 12px;
  background: #ff3b30; color: #fff; font: 600 14px/23px var(--font); text-align: center; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); }
.badge[hidden] { display: none; }
.dock { position: absolute; left: 12px; right: 12px; bottom: 22px; height: 92px; border-radius: 32px; padding: 0 14px;
  background: rgba(255, 255, 255, .17); backdrop-filter: blur(26px) saturate(160%); display: flex; align-items: center; justify-content: space-around; }
.dock .app .label { display: none; }
.pager { position: absolute; bottom: 124px; left: 0; right: 0; display: flex; justify-content: center; }
.pager span { background: rgba(255, 255, 255, .18); backdrop-filter: blur(20px); padding: 4px 10px; border-radius: 12px; font-size: 12px; display: flex; gap: 6px; align-items: center; }
.pager svg { width: 12px; height: 12px; fill: #fff; }

/* ------------------------------------------------------------------ barres de navigation */
.navbar { flex: none; padding: 52px 14px 6px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 92px; position: relative; z-index: 5; }
.navbar.blur { background: var(--bar); backdrop-filter: blur(22px) saturate(180%); border-bottom: .5px solid var(--sep); }
.navbar .title { font: 600 17px var(--font-display); text-align: center; }
.navbtn { color: var(--blue); font-size: 17px; display: inline-flex; align-items: center; gap: 3px; justify-self: start; }
.navbtn svg { width: 12px; height: 20px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.navbtn.right { justify-self: end; }
.navbtn[disabled] { opacity: .35; cursor: default; }
.big-title { font: 700 34px/1.12 var(--font-display); padding: 2px 16px 8px; letter-spacing: .2px; }
.big-sub { font-size: 15px; color: var(--text2); padding: 0 16px 10px; margin-top: -4px; }
.search { margin: 2px 16px 12px; height: 36px; border-radius: 10px; background: var(--fill); display: flex; align-items: center;
  gap: 6px; padding: 0 8px; color: var(--text2); }
.search input { flex: 1; border: 0; outline: 0; background: none; color: var(--text); font: 17px var(--font); min-width: 0; }
.search input::placeholder { color: var(--text2); }
.section-h { font: 400 13px var(--font); color: var(--text2); padding: 18px 32px 7px; text-transform: uppercase; letter-spacing: .2px; }
.section-h.flat { padding-left: 16px; }
.group { margin: 0 16px 8px; background: var(--bg-elev); border-radius: 12px; overflow: hidden; }
.cell { width: 100%; display: flex; align-items: center; gap: 12px; padding: 0 0 0 16px; min-height: 46px; text-align: left; position: relative; }
.cell .body { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 11px 16px 11px 0; border-bottom: .5px solid var(--sep); min-height: 46px; }
.cell:last-child .body { border-bottom: 0; }
.cell .k { font-size: 17px; }
.cell .v { font-size: 17px; color: var(--text2); text-align: right; }
.cell .chev { width: 8px; height: 13px; fill: none; stroke: var(--text3); stroke-width: 2.2; flex: none; }
button.cell:active { background: var(--fill); }
.footnote { font-size: 13px; color: var(--text2); padding: 6px 32px 18px; line-height: 1.4; }
.empty { text-align: center; color: var(--text2); font-size: 15px; padding: 40px 30px; line-height: 1.45; }

/* ------------------------------------------------------------------ avatars */
.avatar { flex: none; border-radius: 50%; overflow: hidden; display: grid; place-items: center; color: #fff;
  background: linear-gradient(180deg, #a5abb8, #858994); font-family: var(--font-display); font-weight: 600; position: relative; }
.avatar img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 16%; display: block; }
.avatar.photo { background: linear-gradient(180deg, #dcdde1, #b9bbc1); }

/* ------------------------------------------------------------------ Messages (liste) */
.conv { width: 100%; display: flex; align-items: center; gap: 10px; padding: 0 0 0 6px; text-align: left; }
.conv:active { background: var(--fill); }
.conv .dotcol { width: 12px; display: flex; justify-content: center; }
.conv .udot { width: 10px; height: 10px; border-radius: 50%; background: var(--blue); }
.conv .cbody { flex: 1; min-width: 0; padding: 11px 16px 12px 0; border-bottom: .5px solid var(--sep); }
.conv:last-child .cbody { border-bottom: 0; }
.conv .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.conv .nm { font-weight: 600; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv .tm { font-size: 15px; color: var(--text2); flex: none; display: flex; align-items: center; gap: 6px; }
.conv .pv { font-size: 15px; color: var(--text2); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; }
.conv .pv.typing { color: var(--blue); }

/* ------------------------------------------------------------------ Contacts */
.mycard { display: flex; align-items: center; gap: 14px; padding: 4px 16px 14px; }
.mycard .who { font: 600 21px var(--font-display); }
.mycard .sub { font-size: 14px; color: var(--text2); margin-top: 2px; }
.row-contact { width: 100%; display: flex; align-items: center; gap: 12px; padding: 0 0 0 16px; text-align: left; }
.row-contact:active { background: var(--fill); }
.row-contact .meta { flex: 1; min-width: 0; border-bottom: .5px solid var(--sep); padding: 10px 16px 11px 0; display: flex; align-items: center; gap: 8px; }
.row-contact:last-child .meta { border-bottom: 0; }
.row-contact .txt { flex: 1; min-width: 0; }
.row-contact .name { font-size: 17px; }
.row-contact .name b { font-weight: 600; }
.row-contact .role { font-size: 14px; color: var(--text2); margin-top: 1px; }
.pill { min-width: 20px; height: 20px; border-radius: 10px; background: var(--blue); color: #fff; font: 600 13px/20px var(--font); text-align: center; padding: 0 6px; }

/* ------------------------------------------------------------------ fiche contact */
.poster { position: relative; padding: 4px 16px 20px; display: flex; flex-direction: column; align-items: center; text-align: center; overflow: hidden; }
.poster .bgimg { position: absolute; inset: -40px; background-size: cover; background-position: 50% 20%; filter: blur(40px) saturate(1.4) brightness(.55); opacity: .9; transform: scale(1.2); }
.poster > *:not(.bgimg) { position: relative; }
#card .poster { padding-top: 96px; }
.poster .pname { font: 700 30px/1.12 var(--font-display); margin-top: 14px; }
.poster .prole { font-size: 15px; color: var(--text2); margin-top: 4px; }
.poster.has-photo .pname, .poster.has-photo .prole { color: #fff; text-shadow: 0 1px 8px rgba(0, 0, 0, .35); }
.poster.has-photo .prole { opacity: .85; }
.cta { display: flex; gap: 10px; padding: 0 16px 18px; }
.cta button { flex: 1; height: 58px; border-radius: 14px; background: var(--bg-elev); color: var(--blue); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px; font-size: 12.5px; font-weight: 500; }
.cta button svg { width: 24px; height: 24px; fill: currentColor; }
.cta button.primary { background: var(--blue); color: #fff; }
.cta button:active { filter: brightness(.85); transform: scale(.98); }
.info-k { font-size: 13px; color: var(--text); }
.info-v { font-size: 17px; color: var(--text); margin-top: 2px; }
.info { padding: 10px 16px; border-bottom: .5px solid var(--sep); }
.info:last-child { border-bottom: 0; }
.link-cell { width: 100%; text-align: left; padding: 12px 16px; color: var(--blue); border-bottom: .5px solid var(--sep); font-size: 17px; }
.link-cell:last-child { border-bottom: 0; }
.link-cell.danger { color: var(--red); }
.link-cell:active { background: var(--fill); }

/* ------------------------------------------------------------------ conversation */
#chat .navbar { padding: 50px 10px 6px; min-height: 0; grid-template-columns: 90px 1fr 90px; }
.chat-head { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.chat-head .n { font-size: 12px; display: flex; align-items: center; gap: 3px; color: var(--text); }
.chat-head .n svg { width: 6px; height: 10px; fill: none; stroke: var(--text3); stroke-width: 2; }
.unread-back { font-size: 14px; background: var(--blue); color: #fff; border-radius: 11px; padding: 1px 7px; margin-left: 1px; min-width: 22px; text-align: center; }
.unread-back[hidden] { display: none; }
#thread { padding: 8px 0 10px; }
.sep-time { text-align: center; font-size: 11px; color: var(--text2); margin: 16px 0 6px; }
.sep-time b { font-weight: 600; }
.msg { display: flex; flex-direction: column; padding: 0 12px; }
.msg.me { align-items: flex-end; }
.msg.them { align-items: flex-start; }
.bubble { position: relative; max-width: 76%; padding: 7px 12px 8px; border-radius: 18px; margin-top: 2px; font-size: 16px;
  line-height: 1.32; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; user-select: text; }
.me .bubble { background: var(--sent); color: var(--sent-text); }
.them .bubble { background: var(--received); color: var(--received-text); }
.bubble.emoji { background: none !important; font-size: 44px; line-height: 1.1; padding: 2px 4px; }
.bubble.emoji::before, .bubble.emoji::after { display: none; }
.msg + .msg { margin-top: 8px; }
.msg.cont { margin-top: 2px !important; }
.bubble.tail::before, .bubble.tail::after { content: ""; position: absolute; bottom: 0; height: 20px; }
.me .bubble.tail::before { right: -7px; width: 20px; background: var(--sent); border-bottom-left-radius: 16px 14px; }
.me .bubble.tail::after { right: -26px; width: 26px; background: var(--bg); border-bottom-left-radius: 10px; }
.them .bubble.tail::before { left: -7px; width: 20px; background: var(--received); border-bottom-right-radius: 16px 14px; }
.them .bubble.tail::after { left: -26px; width: 26px; background: var(--bg); border-bottom-right-radius: 10px; }
.bubble.pop { animation: pop .34s cubic-bezier(.2, 1.4, .4, 1); }
.me .bubble.pop { transform-origin: 100% 100%; animation-name: popme; }
.them .bubble.pop { transform-origin: 0 100%; }
@keyframes pop { from { transform: scale(.55); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes popme { from { transform: translateY(26px) scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }
.bubble .li { display: block; padding-left: 14px; text-indent: -12px; }
.receipt { font-size: 11px; color: var(--text2); margin: 3px 4px 0; font-weight: 500; }
.receipt.failed { color: var(--red); cursor: pointer; }
.typing { display: inline-flex !important; gap: 4px; align-items: center; padding: 12px 14px !important; }
.typing i { width: 8px; height: 8px; border-radius: 50%; background: var(--text2); animation: blink 1.3s infinite ease-in-out; }
.typing i:nth-child(2) { animation-delay: .18s; }
.typing i:nth-child(3) { animation-delay: .36s; }
@keyframes blink { 0%, 60%, 100% { opacity: .3; transform: translateY(0); } 30% { opacity: .95; transform: translateY(-2px); } }
@keyframes spin { to { transform: rotate(360deg); } }
.chips { flex: none; display: flex; gap: 8px; overflow-x: auto; padding: 6px 12px 2px; scrollbar-width: none; background: var(--bg); }
.chips::-webkit-scrollbar { display: none; }
.chips[hidden] { display: none; }
.chip { flex: none; padding: 7px 13px; border-radius: 16px; border: 1px solid var(--sep); color: var(--blue); font-size: 14px; background: var(--bg); white-space: nowrap; }
.chip:active { background: var(--fill); }
.composer { flex: none; display: flex; align-items: flex-end; gap: 8px; padding: 6px 12px 30px; background: var(--bg); }
.composer .plus { width: 34px; height: 34px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; color: var(--text2); flex: none; }
.composer .plus svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
.composer .plus.on { background: var(--blue); color: #fff; }
.field { flex: 1; display: flex; align-items: flex-end; min-height: 36px; border-radius: 18px; border: 1px solid var(--sep); padding: 3px 4px 3px 14px; background: var(--bg); }
.field textarea { flex: 1; resize: none; border: 0; outline: 0; background: none; color: var(--text); font: 17px/1.3 var(--font); max-height: 120px; padding: 4px 0; user-select: text; }
.field textarea::placeholder { color: var(--text3); }
.send { width: 30px; height: 30px; border-radius: 50%; background: var(--blue); display: grid; place-items: center; flex: none; transform: scale(0); transition: transform .18s cubic-bezier(.2, 1.4, .4, 1); }
.send.on { transform: scale(1); }
.send svg { width: 14px; height: 16px; stroke: #fff; stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.composer.disabled .field { opacity: .5; }
.to-bottom { position: absolute; right: 16px; bottom: 132px; width: 36px; height: 36px; border-radius: 50%; background: var(--bg-elev2);
  box-shadow: 0 2px 10px rgba(0, 0, 0, .3); display: grid; place-items: center; z-index: 6; opacity: 0; transform: scale(.6); transition: all .2s; pointer-events: none; }
.to-bottom.show { opacity: 1; transform: none; pointer-events: auto; }
.to-bottom svg { width: 14px; height: 14px; stroke: var(--blue); stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }

/* ------------------------------------------------------------------ Calendrier, Classement, Effectif */
.fx { width: 100%; display: flex; align-items: center; gap: 12px; padding: 0 0 0 16px; }
.fx .day { width: 46px; flex: none; text-align: center; padding: 10px 0; }
.fx .day .dd { font: 600 11px var(--font); color: var(--red); text-transform: uppercase; }
.fx .day .dn { font: 400 24px/1.1 var(--font-display); }
.fx .fb { flex: 1; min-width: 0; padding: 10px 16px 10px 0; border-bottom: .5px solid var(--sep); display: flex; align-items: center; gap: 10px; }
.fx:last-child .fb { border-bottom: 0; }
.fx .teams { flex: 1; min-width: 0; }
.fx .vs { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fx .vs b { font-weight: 600; }
.fx .comp { font-size: 13px; color: var(--text2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.res { flex: none; display: flex; align-items: center; gap: 6px; font: 600 16px var(--font-display); }
.res i { font-style: normal; width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; color: #fff; font: 700 12px var(--font); }
.res i.v { background: var(--green); } .res i.n { background: var(--gray); } .res i.d { background: var(--red); }
.ha { flex: none; font: 600 11px var(--font); color: var(--text2); border: 1px solid var(--sep); border-radius: 5px; padding: 2px 5px; }
table.tb { width: 100%; border-collapse: collapse; font-size: 14px; }
.tb th { font: 600 11px var(--font); color: var(--text2); text-transform: uppercase; padding: 8px 4px; text-align: right; }
.tb th:nth-child(2), .tb td:nth-child(2) { text-align: left; }
.tb td { padding: 9px 4px; border-top: .5px solid var(--sep); text-align: right; font-variant-numeric: tabular-nums; }
.tb td:first-child, .tb th:first-child { padding-left: 14px; width: 30px; text-align: center; color: var(--text2); }
.tb td:last-child, .tb th:last-child { padding-right: 14px; font-weight: 700; }
.tb td:nth-child(2) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
.tb tr.ours td { background: var(--ours); font-weight: 600; }
.tb tr.ours td:first-child { color: var(--blue); }
.pl { width: 100%; display: flex; align-items: center; gap: 12px; padding: 0 0 0 16px; text-align: left; }
.pl:active { background: var(--fill); }
.pl .pb { flex: 1; min-width: 0; padding: 8px 16px 8px 0; border-bottom: .5px solid var(--sep); display: flex; align-items: center; gap: 10px; }
.pl:last-child .pb { border-bottom: 0; }
.pl .pn { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl .ps { font-size: 13px; color: var(--text2); margin-top: 1px; }
.pl .stat { margin-left: auto; text-align: right; flex: none; font-size: 13px; color: var(--text2); }
.pl .stat b { display: block; color: var(--text); font-size: 15px; }
.seg { display: flex; background: var(--fill); border-radius: 9px; padding: 2px; margin: 0 16px 12px; }
.seg button { flex: 1; padding: 6px 0; border-radius: 7px; font-size: 13px; font-weight: 500; color: var(--text); }
.seg button.on { background: var(--bg-elev2); box-shadow: 0 1px 4px rgba(0, 0, 0, .18); font-weight: 600; }
:root:not([data-theme="light"]) .seg button.on { background: #636366; }
.switch { width: 51px; height: 31px; border-radius: 16px; background: var(--fill); position: relative; flex: none; transition: background .25s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .25); transition: transform .25s; }
.switch.on { background: var(--green); }
.switch.on::after { transform: translateX(20px); }
.sicon { width: 29px; height: 29px; border-radius: 7px; display: grid; place-items: center; flex: none; color: #fff; }
.sicon svg { width: 18px; height: 18px; fill: currentColor; }

/* ------------------------------------------------------------------ notification, feuille, toast, menu */
.banner { position: absolute; top: 52px; left: 10px; right: 10px; z-index: 70; border-radius: 22px; padding: 11px 12px;
  background: rgba(44, 44, 48, .84); color: #fff; backdrop-filter: blur(30px) saturate(180%); display: flex; gap: 10px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .35); transform: translateY(calc(-100% - 80px)); opacity: 0;
  transition: transform .45s cubic-bezier(.2, .9, .3, 1.1), opacity .3s; cursor: pointer; text-align: left; pointer-events: none; }
:root[data-theme="light"] .banner { background: rgba(245, 245, 247, .92); color: #000; }
.banner.show { transform: translateY(0); opacity: 1; pointer-events: auto; }
.banner .bt { flex: 1; min-width: 0; }
.banner .bh { display: flex; justify-content: space-between; font-size: 15px; }
.banner .bh b { font-weight: 600; }
.banner .bh span { font-size: 13px; opacity: .55; }
.banner .bb { font-size: 15px; opacity: .92; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 1px; }
.banner .appmini, .note .appmini { width: 20px; height: 20px; border-radius: 5px; position: absolute; left: 26px; top: 26px; border: 2px solid rgba(44, 44, 48, .9); }
.sheet-bg { position: absolute; inset: 0; background: rgba(0, 0, 0, .42); z-index: 80; opacity: 0; transition: opacity .3s; pointer-events: none; }
.sheet-bg.show { opacity: 1; pointer-events: auto; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; top: 64px; z-index: 81; background: var(--bg-grouped); border-radius: 14px 14px 40px 40px;
  transform: translateY(105%); transition: transform .42s cubic-bezier(.32, .72, 0, 1); display: flex; flex-direction: column; }
.sheet.show { transform: translateY(0); }
.sheet .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--text3); margin: 6px auto 0; }
.sheet .sh { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 10px 16px; font-weight: 600; }
.cand { width: 100%; display: flex; align-items: center; gap: 12px; padding: 0 0 0 16px; text-align: left; }
.cand .cb { flex: 1; display: flex; align-items: center; justify-content: space-between; padding: 9px 16px 9px 0; border-bottom: .5px solid var(--sep); }
.cand:last-child .cb { border-bottom: 0; }
.cand .s { font-size: 13px; color: var(--text2); }
.cand .ck { color: var(--blue); font-weight: 700; }
.cand:active { background: var(--fill); }
.toast { position: absolute; left: 50%; bottom: 112px; transform: translate(-50%, 20px); z-index: 90; padding: 9px 15px; border-radius: 18px;
  background: rgba(60, 60, 64, .94); color: #fff; font-size: 13px; opacity: 0; transition: all .3s; pointer-events: none; max-width: 86%; text-align: center; backdrop-filter: blur(20px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.menu { position: absolute; z-index: 85; min-width: 170px; border-radius: 13px; background: rgba(40, 40, 44, .92); backdrop-filter: blur(30px);
  box-shadow: 0 10px 30px rgba(0, 0, 0, .4); overflow: hidden; display: none; }
:root[data-theme="light"] .menu { background: rgba(250, 250, 252, .95); }
.menu.show { display: block; animation: pop .2s ease-out; }
.menu button { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 11px 15px; font-size: 16px; border-bottom: .5px solid var(--sep); }
.menu button:last-child { border-bottom: 0; }
.menu button:active { background: var(--fill); }
.menu svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 16px 14px; }
.kv div { background: var(--bg-elev); border-radius: 12px; padding: 10px 12px; }
.kv .k2 { font-size: 12px; color: var(--text2); }
.kv .v2 { font: 600 17px var(--font-display); margin-top: 3px; }
.kv .v2 small { font: 400 12px var(--font); color: var(--text2); display: block; margin-top: 1px; }

/* ------------------------------------------------------------------ Mercato */
.ic-mercato { background: linear-gradient(180deg, #ffb340 0%, #f2760a 100%); }
.state { display: inline-block; font: 600 11.5px/1 var(--font); padding: 4px 7px; border-radius: 6px; margin-top: 4px; white-space: nowrap; }
.state.ok { background: rgba(48, 209, 88, .18); color: var(--green); }
.state.ko { background: rgba(255, 69, 58, .16); color: var(--red); }
.state.wip { background: rgba(255, 159, 10, .18); color: var(--orange); }
.state.later { background: rgba(10, 132, 255, .16); color: var(--blue); }
.state.none { background: var(--fill); color: var(--text2); }
.buyer { padding: 10px 16px; border-bottom: .5px solid var(--sep); }
.buyer:last-child { border-bottom: 0; }
.buyer .bn { display: flex; justify-content: space-between; font-size: 16px; }
.buyer .bn b { font-weight: 600; }
.buyer .br { font-size: 13px; color: var(--text2); margin-top: 2px; line-height: 1.35; }
.loading { color: var(--text2); font-size: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 8px; }
.loading::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--text3); border-top-color: var(--text2); animation: spin .8s linear infinite; }

/* ------------------------------------------------------------------ Calendrier (mois) */
.month { margin: 0 16px 6px; background: var(--bg-elev); border-radius: 12px; padding: 8px 8px 10px; }
.month .mh { display: flex; align-items: center; justify-content: space-between; padding: 2px 6px 8px; font: 600 16px var(--font-display); }
.month .mh button { color: var(--blue); width: 30px; height: 30px; display: grid; place-items: center; border-radius: 15px; }
.month .mh button:active { background: var(--fill); }
.month .mh button[disabled] { opacity: .3; }
.month .mh svg { width: 10px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.mgrid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 2px; text-align: center; }
.mgrid .wd { font: 600 11px var(--font); color: var(--text2); padding-bottom: 4px; text-transform: uppercase; }
.mgrid .dc { position: relative; height: 38px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 16px; border-radius: 19px; }
.mgrid .dc.out { visibility: hidden; }
.mgrid .dc.today span { background: var(--red); color: #fff; font-weight: 600; }
.mgrid .dc span { width: 30px; height: 30px; border-radius: 15px; display: grid; place-items: center; }
.mgrid .dc i { position: absolute; bottom: 1px; width: 5px; height: 5px; border-radius: 50%; background: var(--text3); }
.mgrid .dc i.up { background: var(--blue); } .mgrid .dc i.v { background: var(--green); } .mgrid .dc i.d { background: var(--red); } .mgrid .dc i.n { background: var(--gray); }
button.dc:active span { background: var(--fill); }
button.fx { text-align: left; }
button.fx:active { background: var(--fill); }
.fx.flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { background: var(--ours); } to { background: transparent; } }
.match-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; padding: 8px 16px 18px; text-align: center; }
.match-head .club { font: 600 17px var(--font-display); }
.match-head .club.ours { color: var(--blue); }
.match-head .sc { font: 700 34px var(--font-display); }
.match-head .sc.vs { font-size: 18px; color: var(--text2); font-weight: 500; }

/* ------------------------------------------------------------------ Effectif : onze type et notes de poste */
.systems { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 12px; scrollbar-width: none; }
.systems::-webkit-scrollbar { display: none; }
.systems button { flex: none; padding: 6px 12px; border-radius: 15px; background: var(--fill); font-size: 14px; font-variant-numeric: tabular-nums; }
.systems button.on { background: var(--blue); color: #fff; font-weight: 600; }
.pitch { position: relative; margin: 0 16px 8px; aspect-ratio: 68 / 96; border-radius: 14px; overflow: hidden;
  background: repeating-linear-gradient(180deg, #2e874a 0 8.333%, #297b42 8.333% 16.666%); }
.pitch .ln { position: absolute; border: 1.5px solid rgba(255, 255, 255, .42); pointer-events: none; }
.pitch .ln.frame { inset: 3.5%; border-radius: 2px; }
.pitch .ln.half { left: 3.5%; right: 3.5%; top: 50%; height: 0; border-width: 1.5px 0 0; }
.pitch .ln.circle { left: 50%; top: 50%; width: 24%; aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%); }
.pitch .ln.box-t { left: 24%; right: 24%; top: 3.5%; height: 13%; border-top: 0; }
.pitch .ln.box-b { left: 24%; right: 24%; bottom: 3.5%; height: 13%; border-bottom: 0; }
.tok { position: absolute; transform: translate(-50%, -50%); width: 76px; display: flex; flex-direction: column; align-items: center; gap: 3px; z-index: 2; }
.tok .avatar { box-shadow: 0 0 0 2px rgba(255, 255, 255, .85), 0 2px 6px rgba(0, 0, 0, .35); }
.tok .nm { font: 600 11px/1.2 var(--font); color: #fff; background: rgba(0, 0, 0, .42); padding: 2px 6px; border-radius: 6px; max-width: 78px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rt { min-width: 19px; height: 19px; border-radius: 10px; padding: 0 4px; font: 700 11px/19px var(--font); color: #fff; text-align: center; background: var(--green); }
.rt.mid { background: #c99a06; } .rt.low { background: var(--orange); } .rt.bad { background: var(--red); }
.tok .rt { position: absolute; top: -4px; right: 13px; box-shadow: 0 1px 3px rgba(0, 0, 0, .45); }
.rpitch { position: relative; margin: 0 16px 8px; aspect-ratio: 68 / 88; border-radius: 14px; overflow: hidden;
  background: repeating-linear-gradient(180deg, #2e874a 0 10%, #297b42 10% 20%); }
.rdot { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.rdot .rt { min-width: 30px; height: 30px; border-radius: 15px; font-size: 14px; line-height: 30px; box-shadow: 0 1px 4px rgba(0, 0, 0, .35); }
.rdot .rt.no { background: rgba(255, 255, 255, .16); color: rgba(255, 255, 255, .55); font-weight: 500; box-shadow: none; }
.rdot .cd { font: 600 10px var(--font); color: rgba(255, 255, 255, .85); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; padding: 0 16px 6px; font-size: 12px; color: var(--text2); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 10px; border-radius: 5px; display: inline-block; }

/* ------------------------------------------------------------------ écran verrouillé */
#lock { position: absolute; inset: 0; z-index: 45; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 58px 12px 0;
  background:
    radial-gradient(120% 70% at 85% 8%, #b3261e 0%, rgba(179, 38, 30, 0) 55%),
    radial-gradient(110% 70% at 10% 95%, #f2a900 0%, rgba(242, 169, 0, 0) 55%),
    radial-gradient(80% 60% at 20% 30%, #5b0f1a 0%, rgba(91, 15, 26, 0) 70%),
    linear-gradient(160deg, #3a0a12 0%, #1a0508 55%, #2a1205 100%);
  transition: transform .5s cubic-bezier(.32, .72, 0, 1), opacity .4s; touch-action: none; }
#lock.unlocked { transform: translateY(-104%); opacity: 0; pointer-events: none; }
#lock[hidden] { display: none; }
#lock .lk-pad { width: 22px; height: 22px; opacity: .9; margin-top: 2px; }
#lock .lk-date { font: 600 19px var(--font-display); margin-top: 6px; opacity: .92; }
#lock .lk-time { font: 700 88px/1 var(--font-display); letter-spacing: -1px; margin-top: 2px; font-variant-numeric: tabular-nums; }
#lock .lk-widget { margin-top: 14px; width: 100%; border-radius: 20px; padding: 11px 14px; background: rgba(255, 255, 255, .14);
  backdrop-filter: blur(24px) saturate(160%); box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .2); text-align: left; }
#lock .lk-widget .wh { font: 700 11.5px var(--font); letter-spacing: .3px; text-transform: uppercase; opacity: .75; }
#lock .lk-widget .mt { font: 600 17px var(--font-display); margin-top: 3px; }
#lock .lk-widget .ms { font-size: 13px; opacity: .8; margin-top: 2px; }
#lock .lk-notes { width: 100%; margin-top: auto; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; scrollbar-width: none; padding: 8px 0 10px; }
#lock .lk-notes::-webkit-scrollbar { display: none; }
#lock .lk-count { align-self: center; font-size: 13px; opacity: .8; }
.note { position: relative; width: 100%; display: flex; gap: 10px; padding: 11px 12px; border-radius: 22px; text-align: left; color: #fff;
  background: rgba(44, 44, 48, .62); backdrop-filter: blur(30px) saturate(180%); }
.note.stack { box-shadow: 0 8px 0 -4px rgba(44, 44, 48, .5); margin-bottom: 4px; }
.note .bt { flex: 1; min-width: 0; }
.note .bh { display: flex; justify-content: space-between; font-size: 15px; gap: 8px; }
.note .bh b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note .bh span { font-size: 13px; opacity: .55; flex: none; }
.note .bb { font-size: 15px; opacity: .92; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 1px; }
.note .more { font-size: 13px; opacity: .6; margin-top: 2px; }
#lock .lk-hint { font-size: 13px; opacity: .75; padding: 8px 0 34px; flex: none; }

/* ------------------------------------------------------------------ réactions (tapbacks) et réponses rapides */
.tapbar { position: absolute; z-index: 86; display: none; gap: 2px; padding: 5px 6px; border-radius: 26px; background: rgba(44, 44, 48, .96);
  box-shadow: 0 8px 26px rgba(0, 0, 0, .42); backdrop-filter: blur(30px); }
:root[data-theme="light"] .tapbar { background: rgba(250, 250, 252, .98); }
.tapbar.show { display: flex; animation: pop .22s ease-out; }
.tapbar button { width: 38px; height: 38px; border-radius: 50%; font-size: 21px; display: grid; place-items: center; transition: transform .12s; }
.tapbar button:hover { transform: scale(1.15); }
.tapbar button.on { background: var(--blue); }
.bubble.reacted { margin-top: 16px; }
.react { position: absolute; top: -17px; min-width: 30px; height: 28px; padding: 0 5px; border-radius: 14px; background: var(--blue); font-size: 15px;
  display: grid; place-items: center; border: 2px solid var(--bg); line-height: 1; cursor: pointer; z-index: 1; user-select: none; }
.react.new { animation: pop .3s cubic-bezier(.2, 1.4, .4, 1); }
.them .react { right: -14px; } .me .react { left: -14px; background: var(--bg-elev2); }
.chip.quick { background: var(--received); color: var(--received-text); border-color: transparent; font-weight: 500; }
.banner.stack { box-shadow: 0 10px 30px rgba(0, 0, 0, .35), 0 8px 0 -4px rgba(44, 44, 48, .7); }
:root[data-theme="light"] .banner.stack { box-shadow: 0 10px 30px rgba(0, 0, 0, .2), 0 8px 0 -4px rgba(225, 225, 230, .95); }
.banner .more { font-size: 13px; opacity: .55; margin-top: 2px; }
.screen.big-text .scroll { zoom: 1.12; }
</style>
</head>
<body>
<div class="device">
  <div class="screen" id="screen">
    <div class="island"></div>
    <div class="statusbar light" id="statusbar" title="Glisser pour déplacer le téléphone">
      <span id="sb-time">--:--</span>
      <span class="icons">
        <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.6c2.2 0 4.2.9 5.7 2.3l1.1-1.1A9.6 9.6 0 0 0 8 1 9.6 9.6 0 0 0 1.2 3.8l1.1 1.1A8 8 0 0 1 8 2.6zm0 3.2c1.3 0 2.5.5 3.4 1.3l1.1-1.1A6.4 6.4 0 0 0 8 4.2c-1.7 0-3.3.7-4.5 1.8l1.1 1.1c.9-.8 2.1-1.3 3.4-1.3zm0 3.2c-.5 0-1 .2-1.3.5L8 11l1.3-1.5C9 9.2 8.5 9 8 9z"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="18" height="9" rx="2"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" opacity=".45"/></svg>
      </span>
    </div>

    <!-- ================================================================ ACCUEIL -->
    <section class="view" id="home">
      <div class="widgets" id="widgets"></div>
      <div class="apps">
        <button class="app" data-open="calendar"><span class="icon ic-calendar"><span class="d" id="ic-cal-d">—</span><span class="n" id="ic-cal-n">—</span></span><span class="label">Calendrier</span></button>
        <button class="app" data-open="table"><span class="icon ic-table"><svg viewBox="0 0 40 40" fill="#fff"><path d="M12 9h16v3h5v4a7 7 0 0 1-6.6 7 9 9 0 0 1-4.9 4.3V31h4v3H14.5v-3h4v-3.7A9 9 0 0 1 13.6 23 7 7 0 0 1 7 16v-4h5V9zm-2.5 5.5V16a4.5 4.5 0 0 0 3.2 4.3A9 9 0 0 1 12 17v-2.5H9.5zm21 0H28V17a9 9 0 0 1-.7 3.3 4.5 4.5 0 0 0 3.2-4.3v-1.5z"/></svg></span><span class="label">Classement</span></button>
        <button class="app" data-open="squad"><span class="icon ic-squad"><svg viewBox="0 0 40 40" fill="#fff"><path d="M14.5 7 8 10.5l-3.5 7 5 2.5L11 17v16h18V17l1.5 3 5-2.5-3.5-7L25.5 7c-.6 2.4-2.8 4-5.5 4s-4.9-1.6-5.5-4z"/></svg></span><span class="label">Effectif</span></button>
        <button class="app" data-open="mercato"><span class="icon ic-mercato"><svg viewBox="0 0 40 40" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14h20l-5-5M31 26H11l5 5"/></svg><span class="badge" id="badge-mercato" hidden>0</span></span><span class="label">Mercato</span></button>
        <button class="app" data-open="settings"><span class="icon ic-settings"><svg viewBox="0 0 40 40" fill="#fff"><path d="M17.6 5h4.8l.7 3.6a12 12 0 0 1 3.2 1.9l3.5-1.2 2.4 4.1-2.8 2.4a12 12 0 0 1 0 3.7l2.8 2.4-2.4 4.1-3.5-1.2a12 12 0 0 1-3.2 1.9l-.7 3.6h-4.8l-.7-3.6a12 12 0 0 1-3.2-1.9l-3.5 1.2-2.4-4.1 2.8-2.4a12 12 0 0 1 0-3.7L8 13.4l2.4-4.1 3.5 1.2a12 12 0 0 1 3.2-1.9L17.6 5zM20 14.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg></span><span class="label">Réglages</span></button>
      </div>

<script>

const QUICK_REPLIES = ["Oui, vas-y", "Non", "Dis-m'en plus"];
const TAPBACKS = [["love", "❤️"], ["like", "👍"], ["dislike", "👎"], ["laugh", "😂"], ["emphasize", "‼️"], ["question", "❓"]];

    ["Qui vendre ?", "Quels joueurs pourrait-on vendre cet hiver ?"], ["Budgets", "Où en sont nos budgets transferts et salaires ?"]],
  directeur_technique: [["Audit du staff", "Fais-moi un audit rapide du staff."], ["Nos jeunes", "Quels sont nos jeunes les plus prometteurs ?"],

};

// ------------------------------------------------------------------ hôte (fenêtre ClubDirector)
function hostSend(msg) { try { window.chrome && window.chrome.webview && window.chrome.webview.postMessage(msg); } catch (e) { /* hors fenêtre */ } }
try {
  window.chrome && window.chrome.webview && window.chrome.webview.addEventListener("message", (e) => {
    const m = String(e.data || "");
    if (m === "focus") { lockIfIdle(); if (S.view === "chat" && !S.locked) $("input").focus({ preventScroll: true }); refreshAll(); }
    else if (m.startsWith("size:")) { S.phoneSize = Number(m.slice(5)) || null; if (S.view === "settings") renderSettings(); }
    else if (m.startsWith("hotkey:")) S.hotkey = m.slice(7) || S.hotkey;
  });
} catch (e) { /* hors fenêtre */ }

// ------------------------------------------------------------------ API
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "X-ClubDirector-Token": TOKEN, "Content-Type": "application/json", ...(opts.headers || {}) } });
  if (!r.ok) { let d = null; try { d = await r.json(); } catch (e) { /* vide */ } const err = new Error((d && d.detail) || r.statusText); err.status = r.status; err.code = d && d.code; throw err; }
  return r.json();
}
async function streamPost(path, body, onEvent) {
  const r = await fetch(path, { method: "POST", headers: { "X-ClubDirector-Token": TOKEN, "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  if (!r.ok || !r.body) { let d = null; try { d = await r.json(); } catch (e) { /* vide */ } throw new Error((d && d.detail) || r.statusText); }
  const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = "";
  for (;;) {
    const { value, done } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
      for (const line of chunk.split("\n")) if (line.startsWith("data:")) { try { onEvent(JSON.parse(line.slice(5))); } catch (e) { /* ligne incomplète */ } }
    }
  }
}

// ------------------------------------------------------------------ utilitaires
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const hhmm = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const DAYS = ["dim.", "lun.", "mar.", "mer.", "jeu.", "ven.", "sam."];
const MONTHS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
const cap = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
function isoDay(s) { if (!s) return null; const [y, m, d] = s.slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); }
function gameLong(s) { const d = isoDay(s); return d ? d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" }) : ""; }
function gameShort(s) { const d = isoDay(s); return d ? `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}` : ""; }
function initials(name) { return String(name || "?").split(/\s+/).filter(Boolean).map((w) => w[0]).slice(0, 2).join("").toUpperCase(); }
function shortName(c) { return (c && c.person && c.person.first_name) || String((c && (c.name || c.label)) || "").split(" ")[0]; }
function toast(text) { const t = $("toast"); t.textContent = text; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 3000); }
function store(key, value) { try { if (value === undefined) return localStorage.getItem(key); localStorage.setItem(key, value); } catch (e) { return null; } return null; }
function relTime(iso) {
  if (!iso) return "";
  const d = new Date(iso), now = new Date();
  if (d.toDateString() === now.toDateString()) return hhmm(d);
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return "Hier";
  if (now - d < 6 * 864e5) return cap(d.toLocaleDateString("fr-FR", { weekday: "long" }));
  return d.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit", year: "2-digit" });
}
const CHEV = '<svg class="chev" viewBox="0 0 8 13"><path d="m1.5 1.5 5 5-5 5"/></svg>';

// ------------------------------------------------------------------ sons (synthétisés, aucun fichier)
let audio = null;
function sound(kind) {
  if (store("cd-sound") === "off") return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
    o.connect(g); g.connect(audio.destination);
    if (kind === "send") { o.type = "sine"; o.frequency.setValueAtTime(520, t); o.frequency.exponentialRampToValueAtTime(1250, t + .14); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.06, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .18); o.start(t); o.stop(t + .2); }
    else { o.type = "triangle"; [880, 1175, 1568].forEach((f, i) => o.frequency.setValueAtTime(f, t + i * .09)); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.05, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .34); o.start(t); o.stop(t + .36); }
  } catch (e) { /* audio indisponible */ }
}

// ------------------------------------------------------------------ photos (pack de visages de l'entraîneur)
const photoReady = new Map();
function photoUrl(uid) {
  if (!uid) return Promise.resolve(null);
  if (S.photos.has(uid)) return S.photos.get(uid);
  const p = fetch(`/api/photos/${uid}`, { headers: { "X-ClubDirector-Token": TOKEN } })
    .then((r) => (r.ok ? r.blob() : null)).then((b) => (b ? URL.createObjectURL(b) : null)).catch(() => null)
    .then((u) => { if (u) photoReady.set(uid, u); return u; });
  S.photos.set(uid, p);
  return p;
}
function avatar(name, uid, hasPhoto, size, bg) {
  const el = document.createElement("span");
  el.className = "avatar"; el.style.width = el.style.height = size + "px"; el.style.fontSize = Math.round(size * 0.4) + "px";
  if (bg) el.style.background = bg;
  const put = (u) => { el.textContent = ""; el.classList.add("photo"); const img = new Image(); img.alt = ""; img.src = u; el.appendChild(img); };
  if (hasPhoto && uid && photoReady.get(uid)) { put(photoReady.get(uid)); return el; }
  el.textContent = initials(name);
  if (hasPhoto && uid) photoUrl(uid).then((u) => { if (u) put(u); });
  return el;
}
const contactAvatar = (c, size) => avatar(c ? c.name || c.label : "?", c && c.person && c.person.unique_id, c && c.photo, size);

// ------------------------------------------------------------------ horloge
function tick() { const t = hhmm(new Date()); $("sb-time").textContent = t; $("lk-time").textContent = t; }
setInterval(tick, 10000); tick();

// ------------------------------------------------------------------ navigation
const APP_VIEWS = ["messages", "contacts", "card", "chat", "calendar", "table", "squad", "mercato", "settings"];
const LIGHT_BAR = new Set(["home"]);
const raf2 = (fn) => requestAnimationFrame(() => requestAnimationFrame(fn));
function setPos(el, cls) { el.classList.remove("app-closed", "hidden-right", "hidden-left"); if (cls) el.classList.add(cls); }
function syncBars() {
  const light = S.locked || LIGHT_BAR.has(S.view);
  $("statusbar").classList.toggle("light", light); $("home-indicator").classList.toggle("light", light);
}
function show(view, dir = "push") {
  const prev = S.view; if (prev === view) return; S.view = view;
  $("screen").scrollLeft = 0; $("screen").scrollTop = 0;
  syncBars();
  closeMenu();
  if (view === "home") {
    $("home").classList.remove("behind"); setPos($(prev), "app-closed");
    setTimeout(() => { if (S.view === "home") for (const id of APP_VIEWS) $(id).hidden = true; }, 420);
    return;
  }
  const target = $(view);
  if (prev === "home") {
    $("home").classList.add("behind");
    for (const id of APP_VIEWS) if (id !== view) $(id).hidden = true;
    target.hidden = false; setPos(target, "app-closed"); raf2(() => setPos(target, null));
    return;
  }
  const from = $(prev);
  target.hidden = false; setPos(target, dir === "push" ? "hidden-right" : "hidden-left");
  raf2(() => { setPos(target, null); setPos(from, dir === "push" ? "hidden-left" : "hidden-right"); });
  setTimeout(() => { if (S.view !== prev) from.hidden = true; }, 440);
}
function back() {
  if (S.locked) return hostSend("hide");
  if ($("menu").classList.contains("show") || $("tapbar").classList.contains("show")) return closeMenu();
  if ($("sheet").classList.contains("show")) return closeSheet();
  if (S.view === "chat") return show(S.cameFrom, "back");
  if (S.view === "card") return show(S.cardFrom || "contacts", "back");
  if (S.view !== "home") return show("home");
  hostSend("hide");
}
function openApp(name) {
  if (name === "messages") renderConversations();
  if (name === "contacts") renderContacts();
  if (name === "calendar") loadCalendar();
  if (name === "table") loadTable();
  if (name === "squad") loadSquad();
  if (name === "mercato") loadMercato();
  if (name === "settings") renderSettings();
  show(name);
}
for (const b of document.querySelectorAll("[data-open]")) b.onclick = () => openApp(b.dataset.open);
$("home-search").onclick = () => { openApp("contacts"); setTimeout(() => $("search").focus({ preventScroll: true }), 420); };
$("home-indicator").onclick = () => (S.locked ? unlock() : show("home"));
$("card-back").onclick = back;
$("chat-back").onclick = back;
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { e.preventDefault(); back(); return; }
  if (S.locked && (e.key === "Enter" || e.key === " " || e.key === "ArrowUp")) { e.preventDefault(); unlock(); }
});
$("statusbar").addEventListener("mousedown", (e) => { if (e.button === 0) hostSend("drag"); });

// ------------------------------------------------------------------ données
async function refreshAll() {
  try {
    const [status, contacts] = await Promise.all([api("/api/status"), api("/api/contacts")]);
    const before = Object.fromEntries(S.contacts.map((c) => [c.role, c.unread || 0]));
    S.noCareer = false; S.status = status; S.contacts = contacts;
    if (S.started) arrivals(contacts, before);
    S.started = true;
    const gd = status.active && status.active.game_date;
    if (S.lastGameDate && gd && gd !== S.lastGameDate) { toast(`Nouvelle sauvegarde lue : ${gameShort(gd)}`); S.data = {}; }
    S.lastGameDate = gd || S.lastGameDate;
  } catch (e) { if (e.code === "no_career" || e.status === 409) { S.noCareer = true; S.contacts = []; } }
  renderBadges();
  if (S.view === "messages") renderConversations();
  if (S.view === "contacts") renderContacts();
  if (S.view === "card" && S.role) renderCard(S.role);
  if (S.view === "chat" && S.role) renderChatHead();
  try { S.home = await api("/api/phone/home"); } catch (e) { S.home = null; }
  renderHome();
  if (S.locked) renderLock();
  if (!S.noCareer && !S.data.mercato) api("/api/phone/mercato").then((d) => { S.data.mercato = d; renderBadges(); }).catch(() => {});
  autoIntroduceDirector();
}
// Messages arrivés hors d'une réponse en cours (le staff écrit de lui-même après une sauvegarde).
async function arrivals(contacts, before) {
  for (const c of contacts) {
    if ((c.unread || 0) <= (before[c.role] ?? 0) || !c.last || c.last.from !== "them" || S.live[c.role]) continue;
    sound("receive");
    if (S.view === "chat" && S.role === c.role && !S.locked) {
      try { S.threads[c.role] = await api(`/api/contacts/${c.role}/messages`); } catch (e) { /* hors ligne */ }
      renderThread(c.role); markRead(c.role);
    } else {
      delete S.threads[c.role];  // relu à l'ouverture du fil
      notify(c.role, c.last.text);
    }
  }
}
const contact = (role) => S.contacts.find((c) => c.role === role);
const unreadTotal = () => S.contacts.reduce((a, c) => a + (c.unread || 0), 0);
const pendingOffers = () => ((S.data.mercato && S.data.mercato.recues) || []).filter((o) => o.etat === "en cours").length;

  const on = store("cd-badges") !== "off";

async function openChat(role, from = "messages") {

  }
  S.rendered[role] = new Set(S.threads[role].flatMap(bubbleKeys));
  renderThread(role, true);

function pendingQuestion(role) {

async function markRead(role) {

  const c = contact(role); if (c) c.unread = 0; renderBadges();

const splitBubbles = (text) => String(text || "").replace(/\r/g, "").split(/\n\s*\n/).map((t) => t.trim()).filter(Boolean);
const bubbleKeys = (m) => splitBubbles(m.text).map((_, i) => `${m.id}:${i}`);
const EMOJI_ONLY = /^(?:\p{Extended_Pictographic}(?:\ufe0f|\p{Emoji_Modifier}|\u200d\p{Extended_Pictographic})*\s*){1,6}$/u;
function formatBubble(t) {
  return esc(t.replace(/\*\*(.+?)\*\*/g, "$1").replace(/^#+\s*/gm, ""))
    .split("\n").map((line) => /^\s*[-•*]\s+/.test(line) ? `<span class="li">• ${line.replace(/^\s*[-•*]\s+/, "")}</span>` : line).join("\n")
    .replace(/<\/span>\n/g, "</span>");
}
function sepLabel(at, gameDate) {
  const now = new Date(); const sameDay = at.toDateString() === now.toDateString();
  const day = sameDay ? "Aujourd'hui" : cap(at.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" }));
  return `<b>${day}</b> ${hhmm(at)}${gameDate ? ` · dans le jeu : ${gameShort(gameDate)}` : ""}`;
}
function renderThread(role, jump = false) {
  if (S.view !== "chat" || S.role !== role) return;
  const sc = $("thread-scroll");
  const nearBottom = jump || sc.scrollHeight - sc.scrollTop - sc.clientHeight < 140;
  const msgs = S.threads[role] || []; const live = S.live[role];
  const seen = S.rendered[role] || (S.rendered[role] = new Set());
  const box = $("thread"); box.innerHTML = "";
  if (!msgs.length && !live) box.innerHTML = `<div class="empty">Aucun message.<br>Écrivez à ${esc(shortName(contact(role)))} ou choisissez une suggestion.</div>`;
  let prevAt = null, prevGame = null, prevFrom = null;
  const lastMe = [...msgs].reverse().find((m) => m.from === "me");
  const all = live ? [...msgs, live] : msgs;
  all.forEach((m, idx) => {
    const at = m.at ? new Date(m.at) : new Date();
    if (!prevAt || at - prevAt > 15 * 60 * 1000 || (m.game_date && m.game_date !== prevGame)) {
      box.insertAdjacentHTML("beforeend", `<div class="sep-time">${sepLabel(at, m.game_date)}</div>`); prevFrom = null;
    }
    const wrap = document.createElement("div"); wrap.className = "msg " + m.from;
    if (prevFrom === m.from && at - prevAt < 60 * 1000) wrap.classList.add("cont");
    const parts = m.live ? m.parts : splitBubbles(m.text);
    parts.forEach((t, i) => {
      const b = document.createElement("div"); b.className = "bubble selectable"; b.innerHTML = formatBubble(t);
      if (EMOJI_ONLY.test(t)) b.classList.add("emoji");
      const key = `${m.id}:${i}`;
      if (!seen.has(key)) { b.classList.add("pop"); seen.add(key); }
      const next = all[idx + 1];
      const groupEnds = i === parts.length - 1 && !(m.live && m.typing) && !(next && next.from === m.from && next.at && new Date(next.at) - at < 60 * 1000);
      if (groupEnds) b.classList.add("tail");
      // Réaction (tapback) : double-clic ou clic droit ; une par message, affichée sur sa dernière bulle.
      const reactable = typeof m.id === "number";
      if (i === parts.length - 1 && m.reaction) {
        const g = (TAPBACKS.find(([k]) => k === m.reaction) || [])[1];
        if (g) {
          b.classList.add("reacted");
          const r = document.createElement("span"); r.className = "react" + (S.reactedNow === m.id ? " new" : ""); r.textContent = g;
          r.title = "Modifier la réaction"; r.onclick = (e) => { e.stopPropagation(); openTapbar(b, role, m); };
          b.appendChild(r);
        }
      }
      b.addEventListener("contextmenu", (e) => { e.preventDefault(); openMenu(e, t, reactable ? { el: b, role, m } : null); });
      if (reactable) b.addEventListener("dblclick", (e) => { e.preventDefault(); try { window.getSelection().removeAllRanges(); } catch (err) { /* */ } openTapbar(b, role, m); });
      wrap.appendChild(b);
    });
    if (m.live && m.typing) {
      const tb = document.createElement("div"); tb.className = "bubble typing tail"; tb.innerHTML = "<i></i><i></i><i></i>";
      wrap.appendChild(tb);
    }
    if (m.from === "me" && m.failed) {
      const r = document.createElement("div"); r.className = "receipt failed"; r.textContent = "Non distribué · toucher pour réessayer";
      r.onclick = () => retry(role, m); wrap.appendChild(r);
    } else if (m === lastMe && msgs[msgs.length - 1] === m) {
      wrap.insertAdjacentHTML("beforeend", `<div class="receipt">${live && !live.read ? "Distribué" : "Lu"}</div>`);
    }
    box.appendChild(wrap);
    prevAt = at; prevGame = m.game_date || prevGame; prevFrom = m.from;
  });
  if (nearBottom) sc.scrollTop = sc.scrollHeight;
  updateToBottom();
  const c = contact(role); $("composer").classList.toggle("disabled", !c || !c.can_chat);
  S.reactedNow = null;
  renderChips();
}
function updateToBottom() { const sc = $("thread-scroll"); $("to-bottom").classList.toggle("show", sc.scrollHeight - sc.scrollTop - sc.clientHeight > 300); }
$("thread-scroll").addEventListener("scroll", () => {

  if ($("tapbar").classList.contains("show") && Math.abs($("thread-scroll").scrollTop - (S.tapScroll ?? 0)) > 12) closeMenu();

// Menu contextuel d'une bulle (clic droit) : réactions au-dessus de la bulle, copier sous le pointeur.
function openMenu(e, text, target) {
  const m = $("menu"), r = $("screen").getBoundingClientRect();
  m.style.left = Math.min(e.clientX - r.left, r.width - 190) + "px"; m.style.top = Math.min(e.clientY - r.top, r.height - 80) + "px";
  if (target) openTapbar(target.el, target.role, target.m); else $("tapbar").classList.remove("show");
  m.classList.add("show");
  $("menu-copy").onclick = async () => { closeMenu(); try { await navigator.clipboard.writeText(text); toast("Copié"); } catch (err) { toast("Copie impossible"); } };
}
const TAPBACK_TITLES = { love: "J'adore", like: "J'aime", dislike: "Je n'aime pas", laugh: "Ha ha", emphasize: "Important", question: "Question" };
function openTapbar(el, role, m) {
  const bar = $("tapbar"), r = $("screen").getBoundingClientRect(), br = el.getBoundingClientRect();
  bar.innerHTML = TAPBACKS.map(([k, g]) => `<button data-k="${k}" class="${m.reaction === k ? "on" : ""}" title="${TAPBACK_TITLES[k]}" aria-label="${TAPBACK_TITLES[k]}">${g}</button>`).join("");
  bar.classList.add("show"); S.tapScroll = $("thread-scroll").scrollTop;
  const w = bar.offsetWidth, h = bar.offsetHeight;
  const left = Math.max(8, Math.min(m.from === "me" ? br.right - r.left - w : br.left - r.left, r.width - w - 8));
  let top = br.top - r.top - h - 10; if (top < 96) top = br.bottom - r.top + 10;
  bar.style.left = left + "px"; bar.style.top = top + "px";
  for (const b of bar.querySelectorAll("button")) b.onclick = (e) => { e.stopPropagation(); closeMenu(); react(role, m, b.dataset.k === m.reaction ? null : b.dataset.k); };
}
async function react(role, m, reaction) {
  const before = m.reaction || null;
  m.reaction = reaction; S.reactedNow = reaction ? m.id : null; renderThread(role);
  try { await api(`/api/contacts/${role}/messages/${m.id}/reaction`, { method: "PUT", body: JSON.stringify({ reaction }) }); }
  catch (e) { m.reaction = before; renderThread(role); toast("Réaction non enregistrée"); }

// Réponse en cours d'écriture : chaque paragraphe devient une bulle dès qu'il est complet.
function startLive(role) {
  const live = { id: "live" + Date.now(), from: "them", live: true, parts: [], buf: "", typing: true, at: new Date().toISOString(), read: false };
  S.live[role] = live; refreshLists();
  return {
    on(ev) {
      if (ev.type === "delta") {
        live.read = true; live.buf += ev.text;
        let i;
        while ((i = live.buf.search(/\n\s*\n/)) >= 0) {
          const part = live.buf.slice(0, i).trim(); live.buf = live.buf.slice(i).replace(/^\s+/, "");
          if (part) { live.parts.push(part); renderThread(role); }
        }
      } else if (ev.type === "break") {
        const part = live.buf.trim(); live.buf = ""; if (part) { live.parts.push(part); renderThread(role); }
      } else if (ev.type === "tool") {
        live.read = true; renderThread(role);  // le contact travaille : les trois points restent affichés
      } else if (ev.type === "done") { live.final = ev.message; }
      else if (ev.type === "error") { live.error = ev.message; }
    },
    finish() {
      const shown = live.parts.length;
      const part = live.buf.trim(); if (part) live.parts.push(part);
      delete S.live[role];
      const msgs = S.threads[role] || (S.threads[role] = []);
      if (live.final) {
        const seen = S.rendered[role] || (S.rendered[role] = new Set());
        bubbleKeys(live.final).slice(0, shown).forEach((k) => seen.add(k));
        msgs.push(live.final);
      } else if (live.parts.length) msgs.push({ id: live.id, from: "them", text: live.parts.join("\n\n"), at: live.at, sources: [] });
      return live;
    },
  };
}
function refreshLists() { if (S.view === "messages") renderConversations(); if (S.view === "contacts") renderContacts(); if (S.view === "chat") updateChips(); }
async function runReply(role, path, body) {
  const live = startLive(role);
  renderThread(role);
  let failed = false;
  try { await streamPost(path, body, (ev) => live.on(ev)); } catch (e) { failed = e.message || "erreur"; }
  const done = live.finish();
  if (done.error) failed = done.error;
  renderThread(role);
  try { S.contacts = await api("/api/contacts"); } catch (e) { /* hors ligne */ }
  if (done.final) {
    sound("receive");
    if (S.view === "chat" && S.role === role && !S.locked) markRead(role); else notify(role, done.final.text);
  }
  renderBadges(); refreshLists();
  if (S.view === "chat") renderChatHead();
  return failed;
}
async function send() {
  const role = S.role, ta = $("input"), text = ta.value.trim(), c = contact(role);
  if (!text || !c || !c.can_chat) return;
  if (S.live[role]) { toast(`${shortName(c)} est en train d'écrire…`); return; }
  ta.value = ""; autosize();
  const msgs = S.threads[role] || (S.threads[role] = []);
  const mine = { id: "me" + Date.now(), from: "me", text, at: new Date().toISOString(), game_date: S.lastGameDate };
  msgs.push(mine); renderThread(role, true); sound("send");
  const failed = await runReply(role, `/api/contacts/${role}/messages`, { text });
  if (failed) { mine.failed = true; toast(failed); renderThread(role); return; }
  try { S.threads[role] = await api(`/api/contacts/${role}/messages`); S.rendered[role] = new Set(S.threads[role].flatMap(bubbleKeys)); renderThread(role); } catch (e) { /* garde l'affichage */ }
}

const SLOT_X = { GK: [50], DR: [86], DL: [14], WBR: [88], WBL: [12], MR: [87], ML: [13], AMR: [84], AML: [16],
  DC: { 1: [50], 2: [35, 65], 3: [24, 50, 76] }, DM: { 1: [50], 2: [35, 65] }, MC: { 1: [50], 2: [33, 67], 3: [24, 50, 76] },
  AMC: { 1: [50], 2: [35, 65] }, STC: { 1: [50], 2: [34, 66] } };
const rtClass = (v) => (v == null || v < 10 ? "bad" : v >= 18 ? "" : v >= 15 ? "mid" : "low");
function slotPositions(onze) {
  const count = {}, seen = {};
  for (const p of onze) count[p.poste] = (count[p.poste] || 0) + 1;
  return onze.map((p) => {
    const xs = SLOT_X[p.poste]; const i = seen[p.poste] = (seen[p.poste] ?? -1) + 1;
    const list = Array.isArray(xs) ? xs : xs ? xs[count[p.poste]] || xs[1] : [50];
    return [list[i] ?? 50, SLOT_Y[p.poste] ?? 50];
  });
}
async function loadLineup() {

    catch (e) { body.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }

      <span data-av="${p.uid}"></span><span class="rt ${rtClass(p.note_poste)}">${p.note_poste ?? "?"}</span><span class="nm">${esc(p.joueur.split(" ").slice(-1)[0])}</span></button>`).join("");

    ${bench ? `<div class="section-h">Banc</div><div class="group">${bench}</div>` : ""}
    <div class="footnote">${esc([L.methode, ...(L.limitations || [])].filter(Boolean).join(" "))}</div>`;
  const people = [...L.onze, ...L.banc];
  for (const el of body.querySelectorAll("[data-av]")) {
    const p = people.find((x) => String(x.uid) === el.dataset.av), big = !!el.closest(".tok");
    el.replaceWith(avatar(p.joueur, p.unique_id, p.photo, big ? 38 : 40));
  }
  for (const b of body.querySelectorAll("[data-uid]")) b.onclick = () => { const p = (S.data.squad || []).find((x) => String(x.uid) === b.dataset.uid); if (p) openPlayer(p); };

const RATING_SPOTS = { stc: [50, 9], aml: [16, 24], amc: [50, 24], amr: [84, 24], ml: [13, 39], mc: [50, 39], mr: [87, 39],
  wbl: [13, 54], dm: [50, 54], wbr: [87, 54], dl: [15, 69], dc: [50, 69], dr: [85, 69], sw: [50, 81], gk: [50, 93] };
function ratingsPitch(ratings) {
  if (!ratings || !Object.keys(ratings).length) return `<div class="footnote">Notes de poste absentes de la sauvegarde pour ce joueur.</div>`;
  const dots = Object.entries(RATING_SPOTS).map(([code, [x, y]]) => {
    const v = ratings[code];
    return `<span class="rdot" style="left:${x}%;top:${y}%" title="${esc(code.toUpperCase())} : ${v ?? "?"}/20"><span class="rt ${v == null || v < 10 ? "no" : rtClass(v)}">${v ?? "–"}</span><span class="cd">${code.toUpperCase()}</span></span>`;
  }).join("");
  return `<div class="section-h">Notes par poste</div><div class="rpitch"><span class="ln frame" style="position:absolute;inset:3.5%;border:1.5px solid rgba(255,255,255,.35)"></span>${dots}</div>
    <div class="legend"><span><i style="background:var(--green)"></i>Naturel</span><span><i style="background:#c99a06"></i>Compétent</span><span><i style="background:var(--orange)"></i>Dépannage</span><span><i style="background:rgba(127,127,127,.4)"></i>Inadapté (&lt; 10)</span></div>`;
}

const statePill = (e) => `<span class="state ${STATE_CLASS[e] || "none"}">${esc(cap(stateLabel(e)))}</span>`;
async function loadMercato() {
  const body = $("mk-body");

    body.innerHTML = `<div class="loading">Chargement des offres…</div>`;
    try { S.data.mercato = await api("/api/phone/mercato"); } catch (e) { body.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  }

    ${tile("Marge salariale", wb && wb.marge_hebdo && wb.marge_hebdo.texte, wb && wb.masse_hebdo && wb.masse_hebdo.texte ? `par semaine · masse ${wb.masse_hebdo.texte}` : "par semaine")}</div>` : "";

      <div class="pn">${esc(o.joueur || "Joueur inconnu")}</div>

      <span class="stat"><b>${esc(o.montant || "—")}</b>${statePill(o.etat)}</span></span></button>`;

function openOffer(o, side) {

      : `Où en est notre offre pour ${o.joueur} (${o.vendeur_court || o.vendeur}, ${o.montant}) ?`);

      ${sw(ic("#ff3b30", ICONS.eye), "Aperçu des messages", "cd-notif-preview")}
      ${sw(ic("#ff3b30", ICONS.badge), "Pastilles sur les icônes", "cd-badges")}</div>
    <div class="footnote">Les messages reçus pendant que vous êtes ailleurs sont regroupés par contact, en bannière ou sur l'écran verrouillé.</div>
    <div class="section-h">Écran verrouillé</div>
    <div class="group">${cell(ic("#5856d6", ICONS.lock), "Verrouillage automatique", "")}${seg("set-lock", "cd-autolock", "5", [["0", "Jamais"], ["2", "2 min"], ["5", "5 min"], ["15", "15 min"]])}
      <button class="link-cell" id="set-lock-now">Verrouiller maintenant</button></div>
    <div class="footnote">L'écran verrouillé affiche le prochain match et les messages non lus. Il apparaît à l'ouverture du téléphone et après la durée choisie sans activité.</div>
    <div class="section-h">Messages</div>
    <div class="group">${sw(ic("#ff9500", ICONS.bulb), "Suggestions de messages", "cd-chips")}
      ${sw(ic("#ff9500", ICONS.reply), "Réponses rapides", "cd-quick")}</div>
    <div class="footnote">Réponses rapides : « Oui, vas-y », « Non »… quand un contact vous pose une question. Double-clic ou clic droit sur une bulle pour réagir.</div>
    <div class="section-h">Carrière</div>
    <div class="group">${cell(ic("#34c759", ICONS.save), "Date dans le jeu", esc(gameShort(S.lastGameDate) || "—"))}
      ${cell(ic("#34c759", ICONS.save), "Lecture automatique", sync.enabled ? (sync.in_progress ? "en cours…" : "activée") : "désactivée")}
      ${cell(ic("#34c759", ICONS.save), "Dernière lecture", esc(lastSync))}
      ${cell(ic("#007aff", ICONS.euro), "Devise", cur.factor ? `€ · ${String(cur.factor).replace(".", ",")} / £` : "non étalonnée")}</div>
    <div class="section-h">Intelligence artificielle</div>
    <div class="group">${cell(ic("#8e8e93", ICONS.cpu), "Moteur", esc(prov ? prov.name : "aucun"))}
      ${cell(ic("#8e8e93", ICONS.key), "Raccourci", esc(S.hotkey))}</div>
    <div class="footnote">Le téléphone se déplace en saisissant l'heure en haut de l'écran${S.inHost ? "" : " ; sa taille se règle par clic droit sur l'icône ClubDirector de la barre des tâches"}. Les données viennent uniquement de votre sauvegarde FM26 ; les photos, de votre pack de visages.</div>`;
  $("set-av").appendChild(avatar(me, null, false, 58, "linear-gradient(180deg,#6e6cf0,#3634a3)"));
  for (const box of $("set-body").querySelectorAll(".seg[data-key]")) for (const b of box.querySelectorAll("button")) b.onclick = () => {
    store(box.dataset.key, b.dataset.v); applyTheme(); renderSettings();
  };
  for (const b of $("set-body").querySelectorAll(".switch[data-key]")) b.onclick = () => {
    const key = b.dataset.key; store(key, store(key) === "off" ? "on" : "off"); renderSettings(); renderBadges();
    if (key === "cd-sound" && store(key) !== "off") sound("receive");
  };
  if ($("set-size")) for (const b of $("set-size").querySelectorAll("button")) b.onclick = () => {
    S.phoneSize = Number(b.dataset.v); hostSend(`size:${b.dataset.v}`); renderSettings();
  };
  $("set-lock-now").onclick = () => lock();
}
// Thème : « auto » suit Windows (clair ou sombre).
const LIGHT_MQ = window.matchMedia ? window.matchMedia("(prefers-color-scheme: light)") : null;
function applyTheme() {
  const t = store("cd-theme") || "auto";
  const light = t === "clair" || (t === "auto" && LIGHT_MQ && LIGHT_MQ.matches);
  document.documentElement.dataset.theme = light ? "light" : "dark";
  $("screen").classList.toggle("big-text", store("cd-text") === "big");
}
applyTheme();
try { LIGHT_MQ && LIGHT_MQ.addEventListener("change", applyTheme); } catch (e) { /* ancien moteur */ }

// ------------------------------------------------------------------ démarrage
if (autolockMin() > 0) lock();  // le téléphone s'allume sur l'écran verrouillé
refreshAll();
setInterval(() => { if (!Object.keys(S.live).length) refreshAll(); }, 15000);
api("/api/ai/warm", { method: "POST" }).catch(() => {});
</script>
</body>
</html>
